name: check

on:
  push:
  pull_request:

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            os: ubuntu-24.04
            preset: gcc
          - name: clang
            os: ubuntu-24.04
            preset: clang
          - name: Apple clang + libc++
            os: macos-latest
            preset: clang-libcxx
          # std::array iterators are class types instead of pointers, as with
          # some other standard libraries (e.g. MSVC's).
          - name: Apple clang + libc++ with class-type iterators
            os: macos-latest
            preset: clang-libcxx-class-iterators
          - name: MSVC
            os: windows-latest
            preset: msvc
    steps:
      - uses: actions/checkout@v5
      - name: Show the CMake version
        run: cmake --version
      # Configure (doctest is downloaded if it is not installed), build and
      # test.
      - name: Configure, build and test
        run: cmake --workflow --preset ${{ matrix.preset }}
